<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A spreadsheet that stays fast at 100M rows, entirely in the browser." />
    <title>cellforge — sheet</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <a class="logo" href="/">cellforge</a>
        <span class="file-name" id="file-name">Untitled</span>
        <div class="toolbar-actions">
          <button id="btn-undo" type="button" title="Undo (Ctrl+Z)" disabled>Undo</button>
          <button id="btn-redo" type="button" title="Redo (Ctrl+Y)" disabled>Redo</button>
          <span class="toolbar-sep"></span>
          <button id="btn-fill" type="button" title="Copy the top cell down through the selection (Ctrl+D)">Fill ↓</button>
          <button id="btn-sort-asc" type="button" title="Sort rows by the selected column, A→Z / smallest first">Sort A→Z</button>
          <button id="btn-sort-desc" type="button" title="Sort rows by the selected column, Z→A / largest first">Sort Z→A</button>
          <span class="toolbar-sep"></span>
          <button id="btn-new" type="button" title="Start a blank sheet">New</button>
          <button id="btn-open" type="button" title="Open a CSV file (or drag one in)">Open CSV</button>
          <button id="btn-export" type="button" title="Download the sheet as CSV">Export CSV</button>
          <button id="btn-demo" type="button" title="Load 100M rows of generated data">100M demo</button>
        </div>
      </header>

      <div class="formula-bar">
        <span class="cell-ref" id="cell-ref">A1</span>
        <span class="fx">fx</span>
        <input id="formula-input" type="text" spellcheck="false" autocomplete="off" />
      </div>

      <main class="sheet" id="sheet"></main>

      <div class="drop-overlay" id="drop-overlay" hidden>
        <p>Drop a CSV to open it</p>
      </div>

      <footer class="status-bar">
        <span id="status-left">Ready</span>
        <span id="status-right"></span>
      </footer>
    </div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
